<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mahendhar Reddy Kadari - Senior Specialist, Software Engineering at AT&T."
    />
    <title>Resume</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="preload" href="resumeData.json" as="fetch" crossorigin />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="profile">
          <img
            src=""
            alt="Profile Picture"
            class="profile-image"
          />
          <div class="profile-content">
            <h1>
              <span class="first-name"></span>
              <span class="last-name"></span>
            </h1>
            <p class="subtitle"></p>
            <div class="profile-links">
              <a href="#" title="Email"
                ><i class="fas fa-envelope"></i
              ></a>
              <a
                href="#"
                target="_blank"
                title="GitHub"
                ><i class="fab fa-github"></i
              ></a>
              <a
                href="#"
                target="_blank"
                title="LinkedIn"
                ><i class="fab fa-linkedin"></i
              ></a>
              <a href="#" target="_blank" title="Resume"
                ><i class="fas fa-file-alt"></i
              ></a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="about">
        <div class="section-header">
          <h2><i class="fas fa-user"></i> About Me</h2>
        </div>
      </section>
      <section class="carousel">
        <div class="carousel-header">
          <i class="fas fa-tools"></i>
          <h2>Skills</h2>
        </div>
        <div class="carousel-container"></div>
      </section>
      <section class="education">
        <div class="section-header">
          <h2><i class="fas fa-graduation-cap"></i> Education</h2>
        </div>
        <!-- Education items loaded dynamically from resumeData.json -->
      </section>
      <section class="experience">
        <div class="section-header">
          <h2><i class="fas fa-briefcase"></i> Work Experience</h2>
        </div>
      </section>
      <section class="certifications">
        <div class="section-header">
          <h2><i class="fas fa-certificate"></i> Certifications</h2>
        </div>
        <div class="certifications-container"></div>
        <!-- Credly badges loaded dynamically from resumeData.json -->
      </section>
      <section class="projects">
        <div class="section-header">
          <h2><i class="fas fa-project-diagram"></i> Projects</h2>
        </div>
        <div class="projects-grid">
          <!-- Project cards loaded dynamically from resumeData.json -->
        </div>
      </section>
      <section class="tools">
        <div class="section-header">
          <h2><i class="fas fa-tools"></i> Tools</h2>
        </div>
        <div id="tools-container" class="tools-container">
          <!-- Tools loaded dynamically from resumeData.json -->
          <div id="tools-loading" style="text-align: center; padding: 1em">
            Loading tools...
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>
          &copy; <span id="current-year"></span> . All
          rights reserved.
        </p>
        <p>Last Updated: <span id="last-updated"></span></p>
      </div>
    </footer>

    <!-- Add html2pdf.js library -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
      integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <!-- Add PDF generator script -->
    <script src="js/pdf-generator.js"></script>
    <!-- Single script — loads all data from resumeData.json -->
    <script src="js/script.js"></script>
  </body>
</html>
